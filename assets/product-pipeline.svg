<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated product delivery pipeline</title>
  <desc id="desc">A five-stage product pipeline moving from discovery through design, engineering, launch, and growth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101C"/>
      <stop offset=".5" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#11102A"/>
    </linearGradient>
    <linearGradient id="flow" x1="85" y1="0" x2="1115" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22D3EE" stop-opacity=".26"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="particleGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity=".1"/>
    </pattern>
    <style>
      .flow-line { stroke-dasharray: 7 13; animation: dash 9s linear infinite; }
      .card { animation: breathe 4s ease-in-out infinite; }
      .c2 { animation-delay: -.8s; }.c3 { animation-delay: -1.6s; }.c4 { animation-delay: -2.4s; }.c5 { animation-delay: -3.2s; }
      .signal { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .s2 { animation-delay: .35s; }.s3 { animation-delay: .7s; }.s4 { animation-delay: 1.05s; }.s5 { animation-delay: 1.4s; }
      @keyframes dash { to { stroke-dashoffset: -240; } }
      @keyframes breathe { 50% { opacity:.82; } }
      @keyframes ping { 0%,100% { opacity:.25; transform:scale(.65) } 50% { opacity:1; transform:scale(1.15) } }
      @media (prefers-reduced-motion: reduce) {
        .flow-line,.card,.signal { animation:none!important; }
        .traveler { display:none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#dots)"/>
  <circle cx="110" cy="60" r="180" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="1110" cy="270" r="190" fill="#8B5CF6" fill-opacity=".07" filter="url(#soft)"/>

  <text x="42" y="46" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">PRODUCT DELIVERY SYSTEM</text>
  <text x="1158" y="46" text-anchor="end" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="12">IDEA → IMPACT</text>

  <path class="flow-line" d="M132 157H1068" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 157H1068" stroke="#E2E8F0" stroke-opacity=".09" stroke-width="10" stroke-linecap="round"/>

  <g class="card c1" transform="translate(36 84)">
    <rect width="192" height="146" rx="18" fill="#0D1726" stroke="#22D3EE" stroke-opacity=".55"/>
    <circle class="signal" cx="96" cy="73" r="18" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE"/>
    <path d="M88 73H104M96 65V81" stroke="#A5F3FC" stroke-width="2.5" stroke-linecap="round"/>
    <text x="96" y="113" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750">DISCOVER</text>
    <text x="96" y="132" text-anchor="middle" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.3">STRATEGY</text>
  </g>
  <g class="card c2" transform="translate(270 84)">
    <rect width="192" height="146" rx="18" fill="#0D1726" stroke="#38BDF8" stroke-opacity=".5"/>
    <circle class="signal s2" cx="96" cy="73" r="18" fill="#38BDF8" fill-opacity=".12" stroke="#38BDF8"/>
    <path d="M87 78L93 66L98 76L104 68" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="113" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750">DESIGN</text>
    <text x="96" y="132" text-anchor="middle" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.3">EXPERIENCE</text>
  </g>
  <g class="card c3" transform="translate(504 84)">
    <rect width="192" height="146" rx="18" fill="#0D1726" stroke="#60A5FA" stroke-opacity=".5"/>
    <circle class="signal s3" cx="96" cy="73" r="18" fill="#60A5FA" fill-opacity=".12" stroke="#60A5FA"/>
    <path d="M92 65L84 73L92 81M100 65L108 73L100 81" stroke="#BFDBFE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="113" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750">ENGINEER</text>
    <text x="96" y="132" text-anchor="middle" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.3">FULL STACK</text>
  </g>
  <g class="card c4" transform="translate(738 84)">
    <rect width="192" height="146" rx="18" fill="#0D1726" stroke="#818CF8" stroke-opacity=".5"/>
    <circle class="signal s4" cx="96" cy="73" r="18" fill="#818CF8" fill-opacity=".12" stroke="#818CF8"/>
    <path d="M96 62V82M88 70L96 62L104 70" stroke="#C7D2FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="113" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750">SHIP</text>
    <text x="96" y="132" text-anchor="middle" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.3">PRODUCTION</text>
  </g>
  <g class="card c5" transform="translate(972 84)">
    <rect width="192" height="146" rx="18" fill="#0D1726" stroke="#A78BFA" stroke-opacity=".55"/>
    <circle class="signal s5" cx="96" cy="73" r="18" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA"/>
    <path d="M85 80L92 72L98 76L108 64" stroke="#DDD6FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="113" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="750">GROW</text>
    <text x="96" y="132" text-anchor="middle" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.3">MEASURE</text>
  </g>

  <g class="traveler" filter="url(#particleGlow)">
    <circle r="5" fill="#F8FAFC">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M132 157H1068"/>
    </circle>
    <circle r="3" fill="#22D3EE" opacity=".8">
      <animateMotion dur="6.5s" begin="-2.1s" repeatCount="indefinite" path="M132 157H1068"/>
    </circle>
    <circle r="3" fill="#A78BFA" opacity=".8">
      <animateMotion dur="6.5s" begin="-4.2s" repeatCount="indefinite" path="M132 157H1068"/>
    </circle>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="25.25" stroke="url(#flow)" stroke-opacity=".35" stroke-width="1.5"/>
</svg>

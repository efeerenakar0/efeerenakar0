name: Generate profile summary cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate profile metrics
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 3
          EXCLUDE: Shell
          EXCLUDE_REPOS: shellphish-1,SocialFishMobile
          THEME: tokyonight
          ANIMATION: sequence
          DURATION: 2.8
          NAME: Efe Eren Akar
          AUTO_PUSH: true
